[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fh-ui-wrappers"
version = "0.2.0"
description = "Reusable FastHTML + MonsterUI wrappers for buttons, dropdowns, checkboxes and overlays"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Silas Kieser" }]
dependencies = [
    "python-fasthtml>=0.12",
    "monsterui>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools]
packages = ["fh_ui_wrappers"]

[tool.ruff]
line-length = 100
target-version = "py310"
